<html lang="en">
  <head>
    <title>Shell-E: Options</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./options.css" />
  </head>
  <body>
    <main>
      <section>
        <header>
          <img src="../images/icons/logo_128.png" alt="logo" />
          <h1>Shell-E: Options</h1>
        </header>
        <form>
          <label>
            Server Address: <input id="server" name="server" title="server" />
          </label>
          <label>
            Token: <input id="token" name="token" title="token" type="password" autocomplete="off" />
          </label>
          <label>
            Extra sites (one origin per line, e.g. https://example.com). Localhost is always enabled.
            <textarea id="sites" name="sites" rows="4"></textarea>
          </label>
          <label>
            Active <input title="on" id="on" type="checkbox" name="on" />
          </label>
          <p>Start the server with: <code id="allow-hint"></code></p>
          <button id="button-save" type="button">Save</button>
          <p id="message" role="status"></p>
        </form>
      </section>
    </main>
    <script src="./options.mjs"></script>
  </body>
</html>
